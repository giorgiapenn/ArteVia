spring.application.name=ArteVia

# Questo file sovrascrive quello di src/main/resources durante i test.
spring.datasource.url=jdbc:h2:mem:arteviatest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT
jwt.secret=chiaveSegretaSoloPerITestJUnitAlmeno32Caratteri!!
jwt.access-token.expiration-ms=900000
jwt.refresh-token.expiration-ms=2592000000


# Art Institute of Chicago API
artic.api.base-url=https://api.artic.edu/api/v1

resilience4j.ratelimiter.configs.articApi.limit-for-period=5
resilience4j.ratelimiter.configs.articApi.limit-refresh-period=60s
resilience4j.ratelimiter.configs.articApi.timeout-duration=0s