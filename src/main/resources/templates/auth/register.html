<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrati — ArteVia</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a href="/" style="color:inherit;text-decoration:none;"><span class="brand">ArteVia</span></a>
        <nav><a href="/auth/login">Accedi</a></nav>
    </header>

    <div class="container-narrow" style="padding-top:50px;">
        <div class="panel">
            <span class="eyebrow">Nuovo account</span>
            <h2>Crea il tuo profilo</h2>

            <form id="registerForm" novalidate>
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" required>
                    <div class="field-error" id="err-username"></div>
                </div>
                <div class="field">
                    <label for="name">Nome</label>
                    <input type="text" id="name" required>
                    <div class="field-error" id="err-name"></div>
                </div>
                <div class="field">
                    <label for="lastname">Cognome</label>
                    <input type="text" id="lastname" required>
                    <div class="field-error" id="err-lastname"></div>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <div class="field-error" id="err-email"></div>
                </div>
                <div class="field">
                    <label for="address">Indirizzo <span style="font-weight:400;">(opzionale)</span></label>
                    <input type="text" id="address">
                </div>
                <div class="field">
                    <label for="age">Età <span style="font-weight:400;">(opzionale)</span></label>
                    <input type="number" id="age" min="14">
                    <div class="field-error" id="err-age"></div>
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                    <div class="field-hint">Almeno 8 caratteri, con una maiuscola, una minuscola, un numero e un carattere speciale.</div>
                    <div class="field-error" id="err-password"></div>
                </div>

                <button type="submit" style="width:100%;">Registrati</button>
                <div id="serverMsg" role="alert"></div>
            </form>

            <p style="margin-top:18px;font-size:0.9rem;">Hai già un account? <a href="/auth/login">Accedi</a></p>
        </div>
    </div>

    <script>
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex = /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$%^&+=!]).{8,}$/;

        function setError(fieldId, message) {
            document.getElementById('err-' + fieldId).textContent = message || '';
            document.getElementById(fieldId).classList.toggle('invalid', !!message);
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function validateForm() {
            let valid = true;
            const username = document.getElementById('username').value.trim();
            const name = document.getElementById('name').value.trim();
            const lastname = document.getElementById('lastname').value.trim();
            const email = document.getElementById('email').value.trim();
            const age = document.getElementById('age').value;
            const password = document.getElementById('password').value;

            setError('username', username ? '' : 'Lo username è obbligatorio');
            if (!username) valid = false;

            setError('name', name ? '' : 'Il nome è obbligatorio');
            if (!name) valid = false;

            setError('lastname', lastname ? '' : 'Il cognome è obbligatorio');
            if (!lastname) valid = false;

            if (!email) { setError('email', 'L\'email è obbligatoria'); valid = false; }
            else if (!emailRegex.test(email)) { setError('email', 'Formato email non valido'); valid = false; }
            else setError('email', '');

            if (age && parseInt(age) < 14) { setError('age', 'Età minima 14 anni'); valid = false; }
            else setError('age', '');

            if (!password) { setError('password', 'La password è obbligatoria'); valid = false; }
            else if (!passwordRegex.test(password)) {
                setError('password', 'La password non rispetta i requisiti richiesti');
                valid = false;
            } else setError('password', '');

            return valid;
        }

        // Validazione "live" mentre l'utente scrive, per feedback immediato
        ['username','name','lastname','email','age','password'].forEach(id => {
            document.getElementById(id).addEventListener('blur', validateForm);
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const serverMsg = document.getElementById('serverMsg');
            serverMsg.innerHTML = '';

            if (!validateForm()) return;

            const body = {
                username: document.getElementById('username').value.trim(),
                name: document.getElementById('name').value.trim(),
                lastname: document.getElementById('lastname').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim(),
                age: parseInt(document.getElementById('age').value) || null,
                password: document.getElementById('password').value
            };

            try {
                const res = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (res.ok) {
                    serverMsg.innerHTML = '<div class="banner success">Registrazione avvenuta! Ti reindirizziamo al login…</div>';
                    setTimeout(() => window.location.href = '/auth/login', 1200);
                } else if (data.error) {
                    serverMsg.innerHTML = `<div class="banner error">${escapeHtml(data.error)}</div>`;
                } else {
                    const messages = Object.values(data).join(' — ');
                    serverMsg.innerHTML = `<div class="banner error">${escapeHtml(messages || 'Errore nella registrazione')}</div>`;
                }
            } catch (err) {
                serverMsg.innerHTML = '<div class="banner error">Impossibile contattare il server. Riprova.</div>';
            }
        });
    </script>
</body>
</html>
