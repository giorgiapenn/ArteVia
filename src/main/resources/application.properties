spring.application.name=ArteVia

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/ARTEVIA
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:cambiaQuestaChiaveConAlmeno32CaratteriCasualiSegreti123!}
jwt.access-token.expiration-ms=900000
jwt.refresh-token.expiration-ms=2592000000

# HTTPS
server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=https

# Art Institute of Chicago API (nessuna key richiesta)
artic.api.base-url=https://api.artic.edu/api/v1

resilience4j.ratelimiter.configs.articApi.limit-for-period=5
resilience4j.ratelimiter.configs.articApi.limit-refresh-period=60s
resilience4j.ratelimiter.configs.articApi.timeout-duration=0s

# Actuator
management.endpoints.web.exposure.include=health,info